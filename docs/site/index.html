<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nopioid</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0c1118; color: #eef2f6; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px; background: radial-gradient(circle at 70% 14%, rgba(244, 114, 182, .13), transparent 32%), #0c1118; }
      main { width: min(1080px, 100%); display: grid; gap: 24px; }
      h1 { margin: 0; font-size: clamp(44px, 8vw, 96px); line-height: .94; letter-spacing: 0; }
      p { max-width: 800px; margin: 0; color: #a9b4c0; font-size: 18px; line-height: 1.55; }
      img { width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: #fff; }
      .meta { color: #f0abfc; font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <main>
      <div class="meta">aggregate risk modeling</div>
      <h1>Nopioid</h1>
      <p>A public-health modeling project shown through aggregate risk-score output. This static page intentionally avoids provider-identifying dashboard screenshots.</p>
      <img src="assets/risk-score.png" alt="Aggregate risk-score output" />
    </main>
  </body>
</html>
